name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-compat:
    name: pip install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14 without uv
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install with stdlib venv and pip
        shell: bash
        run: |
          python_path="$(command -v python)"
          venv_path="${RUNNER_TEMP}/kimi-agent-pip"
          export PATH=/usr/bin:/bin
          test -z "$(command -v uv || true)"
          "$python_path" --version
          "${python_path}" -m venv "$venv_path"
          "$venv_path/bin/python" -m pip --disable-pip-version-check install \
            --editable ./packages/kimi-agent-module-api --editable .
          test ! -e build
          test ! -e packages/kimi-agent-module-api/build
          test ! -e modules/example/build
          "$venv_path/bin/python" -m pip check
          "$venv_path/bin/python" -c \
            "import aiohttp, discord, kimi_agent_module_api, openai, pydantic"

  check:
    name: lint + types + tests
    runs-on: ubuntu-latest
    # The suite runs in well under a minute; anything past this is a hang.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: bot/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: bot/deploy/betterwright/package-lock.json

      - name: Check browser runtime lock
        run: |
          npm ci --prefix deploy/betterwright --omit=dev --omit=optional --ignore-scripts
          npm audit --prefix deploy/betterwright --omit=dev
          node --check web_browser/bridge.mjs
          node --check web_browser/visual_bridge.mjs

      - name: Test browser runtime
        run: node --test tests/js/*.test.mjs

      # mypy is pinned to platform = "linux" in pyproject.toml, and
      # sqlcipher3-binary is a Linux-only dependency, so CI matches the
      # deployment target rather than a dev host.
      - name: Set up Python
        run: uv python install 3.14

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that skipped a re-lock cannot merge.
      - name: Sync dependencies
        run: uv sync --locked --all-packages --extra dev

      - name: Check documented uv and pip interoperability
        run: |
          .venv/bin/python -m ensurepip
          .venv/bin/python -m pip --disable-pip-version-check install \
            --no-deps --editable ./packages/kimi-agent-module-api --editable .
          test ! -e build
          test ! -e packages/kimi-agent-module-api/build
          test ! -e modules/example/build
          .venv/bin/python -m pip check

      - name: Audit locked dependencies
        run: uv --preview-features audit-command audit --locked

      - name: Ruff
        run: uv run ruff check .

      # E501 is deliberately unselected in the lint config: line length is the
      # formatter's job, so the formatter has to actually run somewhere.
      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: |
          uv run mypy .
          uv run mypy --config-file modules/example/pyproject.toml modules/example/src modules/example/tests

      - name: Tests
        run: uv run python -m pytest -q

      - name: Build module API and reference consumer
        run: |
          uv build --package kimi-agent-module-api --no-sources --out-dir dist/module-api
          uv build --package community-agent-reference-module --no-sources --out-dir dist/reference-module

      - name: Test built module API through the reference wheel
        shell: bash
        run: |
          api_wheel=$(find dist/module-api -maxdepth 1 -name '*.whl' -print -quit)
          api_sdist=$(find dist/module-api -maxdepth 1 -name '*.tar.gz' -print -quit)
          reference_wheel=$(find dist/reference-module -maxdepth 1 -name '*.whl' -print -quit)
          test -n "${api_wheel}"
          test -n "${api_sdist}"
          test -n "${reference_wheel}"
          uv run python scripts/verify_module_api_dist.py verify "${api_wheel}" "${api_sdist}" "${reference_wheel}"
