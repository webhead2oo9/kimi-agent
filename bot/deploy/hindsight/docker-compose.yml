# Hindsight memory backend for Kimi.
#
# Deploy: copy this dir to the Docker host, copy `.env.example` to `.env`, fill
# the private provider route, then `docker compose up -d`. See README.md.
#
# Storage is a HOST BIND MOUNT (./data). The embedded Postgres (pg0) data
# lives on the host filesystem so it is plainly visible and cannot be lost to
# a stray `docker volume prune`/`down -v`.
#
# Compose still pulls an image tagged :latest when pull_policy is `missing`.
# Pin an immutable version tag or digest when upgrades must happen only after
# review; then use `docker compose pull && docker compose up -d` deliberately.
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: missing
    container_name: kimi-hindsight
    restart: unless-stopped
    ports:
      # Hindsight has no authentication in this template. Keep both endpoints
      # local unless .env explicitly names a trusted LAN/VPN interface.
      - "${HINDSIGHT_API_BIND_ADDRESS:-127.0.0.1}:8890:8888"
      - "${HINDSIGHT_CONTROL_BIND_ADDRESS:-127.0.0.1}:9990:9999"
    volumes:
      - ./data:/home/hindsight/.pg0
    # Provider identity, endpoints, credentials, and model IDs are private
    # deployment choices supplied by the adjacent ignored .env file.
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL}
      - HINDSIGHT_API_RETAIN_LLM_MODEL=${HINDSIGHT_LLM_MODEL}
      - HINDSIGHT_API_RETAIN_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER}
      - HINDSIGHT_API_RETAIN_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL}
      - HINDSIGHT_API_RETAIN_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY}
      - HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS=32768
      - HINDSIGHT_API_CONSOLIDATION_LLM_MODEL=${HINDSIGHT_LLM_MODEL}
      - HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER}
      - HINDSIGHT_API_CONSOLIDATION_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL}
      - HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY}
