# Copy this file to models.yaml and replace every placeholder with deployment-owned
# eval routing. models.yaml is intentionally ignored because it can reveal private
# providers, local endpoints, model choices, pricing, and credentials' environment
# variable names.
baseline:
  label: baseline-example
  provider_name: openai_compat
  model: provider/baseline-model
  base_url: https://eval-gateway.example.invalid/v1
  api_key_env: EVAL_BASELINE_API_KEY
  capabilities: [text, tool_calling]
  pricing: {input: 1.0, cached_read: 0.1, output: 2.0, cache_write: 0.0}

candidates:
  candidate-example:
    label: candidate-example
    provider_name: openai_compat
    model: provider/candidate-model
    base_url: https://eval-gateway.example.invalid/v1
    api_key_env: EVAL_CANDIDATE_API_KEY
    # Optional guardrails for slow or rate-limited experimental gateways.
    timeout_seconds: 300
    min_request_interval_seconds: 0
    capabilities: [text, tool_calling]

  vision-example:
    label: vision-example
    provider_name: openai_compat
    model: provider/vision-model
    base_url: https://eval-gateway.example.invalid/v1
    api_key_env: EVAL_VISION_API_KEY
    capabilities: [text, tool_calling, image_input]

# Optional shared image transcription model. When configured, both harness and
# qualification runs send every image here once, cache the resulting caption,
# and give that same text to every evaluated model (including native-vision
# models). This keeps visual evidence constant across model arms.
image_captioner:
  label: captioner-example
  provider_name: openai_compat
  model: provider/vision-model
  base_url: https://eval-gateway.example.invalid/v1
  api_key_env: EVAL_VISION_API_KEY
  capabilities: [text, image_input]

# The qualification runner uses this judge. Keep real judge routing in the ignored
# models.yaml alongside the other live eval profiles.
judge:
  label: judge-example
  provider_name: openai_compat
  model: provider/judge-model
  base_url: https://eval-gateway.example.invalid/v1
  api_key_env: EVAL_JUDGE_API_KEY
  capabilities: [text]
