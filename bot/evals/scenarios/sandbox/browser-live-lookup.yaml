id: browser-live-lookup
category: sandbox
trust_tier: MEMBER
channel: { name: general-chat, id: "800000000000000003" }
requires_tools: [browser]
turns:
  - "can you open the status page for our git host and tell me if the incident from this morning is resolved yet?"
expect:
  should_use_tools: [browser]
  notes: >-
    A live page whose current state is the whole question. Graded on reaching for
    the browser rather than answering from stale knowledge or a cached summary.
