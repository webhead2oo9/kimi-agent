[project]
name = "bram-agent-module-api"
version = "2.3.0"
description = "Stable contracts for community-built assistant modules"
requires-python = ">=3.14"
authors = [{ name = "Webhead" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pydantic-settings>=2.14.2"]

[project.urls]
Documentation = "https://github.com/bram-agent/bram-agent/blob/main/docs/modules.md"
Issues = "https://github.com/bram-agent/bram-agent/issues"
Repository = "https://github.com/bram-agent/bram-agent"

[project.optional-dependencies]
# bram_agent_module_api.testing.MemoryStorage runs real SQL in unit tests.
testing = ["aiosqlite"]

[dependency-groups]
test = ["aiosqlite", "pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bram_agent_module_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
